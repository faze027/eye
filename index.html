<script>
"use strict";
/*
  Eye -> Space  (the same animation as eye_to_space.py, running directly in the browser)

  Her photo appears, drawn entirely with coloured text characters. The camera flies into her
  eye, the eye comes alive and blinks, then dives through the pupil into a starfield, to a
  beating heart, and finally asks the question in the same style.

  Change the words here (\n starts the second line: the first goes above the heart, the second
  below), or add ?msg=Line%20above|Line%20below to the page address.
  Controls: click / tap = full screen and start over, R or Space = replay, F = full screen,
            double-click / double-tap = replay.
*/
const MESSAGE = "Te Dua\nMe Mungon ho";

// ----------------------------------------------------------------------------- settings
const ROWS = 56;                 // character rows on screen
const ASPECT = 1.30;             // narrowest picture shape (width / height); narrower screens get bars
const MAX_ASPECT = 2.0;          // widest picture shape
const MAX_HEIGHT = 1500;         // above this many pixels tall, draw at half size and scale up (speed)
const FPS = 30;                  // frames per second, like the Python version
const SUPERSAMPLE = [2, 1];      // samples per character (rows, cols)

// timeline (seconds)
const T_PHOTO_IN = [0.3, 1.6];       // her photo fades in
const T_PHOTO_ZOOM = [2.3, 7.0];     // camera flies into her eye...
const CREEP = 1.12;                  // ...and keeps drifting in this much more until the dive
const INTRO_DETAIL = 2.0;            // the opening photo uses characters this many times smaller...
const T_GRID = [4.2, 5.0];           // ...which dissolve into the normal size during this time
const T_REVEAL = [5.7, 7.9];         // her eye comes alive: the change spreads outwards from the pupil
const BLINKS = [9.0, 10.55];         // blink moments
const GAZE = [[9.45, -0.08, 0.012], [10.05, 0.07, -0.008], [10.8, 0.0, 0.0]];   // (time, x, y) glances
const T_ZOOM = 11.2;                 // dive into the pupil starts
const Z_FULL = 9.0;                  // zoom at which the pupil has swallowed the screen
const T_TEXT = T_ZOOM + 10.8;        // the message starts decoding
const T_DECODE = 3.0;                // how long the decoding sweep takes

// the photo (embedded at the bottom of this page)
const PHOTO_SIZE = [1290, 1571];
const PHOTO_IRIS = [757.0, 359.5];
const PHOTO_IRIS_R = 11.5;
const PHOTO_EYE_TILT = 11.0;
const HER_EYE = { cx: -0.115, w: 1.235, cy: -0.17, slope: -0.105, up: 0.43, upk: 1.0, upskew: 0.28,
                  lo: 0.33, lok: 1.0, loskew: 0.09 };
// the living eye is her own eye: her eyeball (iris and whites), skin, lids and lashes from the photo
const BALL_GRID = [-1.6, 1.6, -0.8, 0.6, 0.01];   // eye-space box (u0, u1, v0, v1) and step of her eyeball
const GLINT = [0.025, 0.115, 0.078, 0.072, [0.67, 0.63, 0.63]];   // her catch-light: offset from the iris
                                                   // centre, size and colour, measured in the photo
const T_PUPIL = [T_ZOOM - 0.3, T_ZOOM + 1.0];      // her pupil is hidden in her dark iris until the dive
const IRIS_EXPOSURE = 2.0;          // up close the camera lets in more light, so her dark iris shows detail
const IRIS_BROWN = [0.62, 0.36, 0.20];   // ...and the warm light in the photo gives way to her iris's brown
const SKIN_GRID = [-3.2, -2.6, 0.02];
const LID_BAND = 0.16, LID_TOP = 0.50, LID_OFF = 0.025;
const PHOTO_FACE_BOX = [560, 190];
const PHOTO_GLOW = [790.0, 470.0];
const PHOTO_BACKDROP_DIM = 0.45;
const PHOTO_BACKDROP = [
  [[0, 0], [1290, 0], [1290, 470], [1185, 445], [1105, 385], [1072, 262], [1022, 132], [965, 80],
   [900, 58], [840, 48], [785, 55], [730, 110], [682, 220], [648, 380], [620, 520], [596, 612],
   [470, 628], [405, 665], [368, 750], [312, 950], [242, 1080], [132, 1200], [55, 1300], [0, 1370]],
  [[875, 1060], [1060, 1010], [1290, 990], [1290, 1571], [875, 1571]],
];

// character ramp, darkest -> brightest
const RAMP = " .'`^\",:;Il!i><~+_-?][}{1)(|\\/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$";
const SCRAMBLE = "!@#$%&*+=?/\\|<>{}[]()01";
const MONO = '"Cascadia Mono", Consolas, Menlo, "SF Mono", "DejaVu Sans Mono", "Liberation Mono", ' +
             '"Ubuntu Mono", "Roboto Mono", "Courier New", monospace';
const SANS = 'Arial, Helvetica, "Liberation Sans", "DejaVu Sans", sans-serif';

const SKIN = [1.00, 0.61, 0.48], LID = [0.80, 0.45, 0.39], LASH = [0.03, 0.02, 0.02];
const WATER = [0.86, 0.48, 0.44], SCLERA = [0.95, 0.91, 0.87], VEIN = [0.88, 0.58, 0.52];
const CARUNCLE = [0.86, 0.47, 0.44], IRIS_MID = [0.66, 0.37, 0.18], IRIS_OUT = [0.38, 0.19, 0.09];
const IRIS_COLL = [0.92, 0.56, 0.29], PUPIL = [0.010, 0.008, 0.012];
const HEART_EDGE = [0.55, 0.04, 0.17], HEART_CORE = [1.00, 0.40, 0.62], HEART_HI = [1.00, 0.88, 0.94];
const HEART_GLOW = [0.70, 0.08, 0.25], TEXT_TOP = [1.00, 0.72, 0.86], TEXT_BOT = [1.00, 0.32, 0.58];
const IRIS_R = 0.50;
const TINTS = [[1.0, 1.0, 1.0], [0.80, 0.88, 1.0], [1.0, 0.92, 0.80]];
const BROWN_N = (() => {                     // IRIS_BROWN scaled to brightness 1
  const [r, g, b] = IRIS_BROWN, l = 0.55 * Math.max(r, g, b) + 0.45 * (0.299 * r + 0.587 * g + 0.114 * b);
  return [r / l, g / l, b / l];
})();

// ----------------------------------------------------------------------------- helpers
function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }
function ss(a, b, x) {                       // smoothstep from a to b (works reversed when a > b)
  let t = (x - a) / (b - a);
  t = t < 0 ? 0 : (t > 1 ? 1 : t);
  return t * t * (3 - 2 * t);
}
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function gaussian(rand) {
  let u = 0;
  while (u === 0) u = rand();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rand());
}
function beat(t) {                           // lub-dub heartbeat pulse, ~1 beat per second
  const ph = t % 1.0;
  return Math.exp(-(((ph - 0.10) / 0.045) ** 2)) + 0.55 * Math.exp(-(((ph - 0.32) / 0.05) ** 2));
}
function makeCanvas(w, h) {
  const c = document.createElement("canvas");
  c.width = Math.max(1, w | 0); c.height = Math.max(1, h | 0);
  return c;
}

// in-place radix-2 FFT
function fft(re, im, inverse) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) {
      let t = re[i]; re[i] = re[j]; re[j] = t;
      t = im[i]; im[i] = im[j]; im[j] = t;
    }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = (inverse ? 2 : -2) * Math.PI / len;
    const wr = Math.cos(ang), wi = Math.sin(ang), half = len >> 1;
    for (let i = 0; i < n; i += len) {
      let cr = 1, ci = 0;
      for (let k = 0; k < half; k++) {
        const a = i + k, b = a + half;
        const xr = re[b] * cr - im[b] * ci, xi = re[b] * ci + im[b] * cr;
        re[b] = re[a] - xr; im[b] = im[a] - xi;
        re[a] += xr; im[a] += xi;
        const ncr = cr * wr - ci * wi;
        ci = cr * wi + ci * wr; cr = ncr;
      }
    }
  }
}
function fft2(re, im, n, inverse) {
  const rr = new Float64Array(n), ri = new Float64Array(n);
  for (let y = 0; y < n; y++) {
    const o = y * n;
    for (let x = 0; x < n; x++) { rr[x] = re[o + x]; ri[x] = im[o + x]; }
    fft(rr, ri, inverse);
    for (let x = 0; x < n; x++) { re[o + x] = rr[x]; im[o + x] = ri[x]; }
  }
  for (let x = 0; x < n; x++) {
    for (let y = 0; y < n; y++) { rr[y] = re[y * n + x]; ri[y] = im[y * n + x]; }
    fft(rr, ri, inverse);
    for (let y = 0; y < n; y++) { re[y * n + x] = rr[y]; im[y * n + x] = ri[y]; }
  }
}
// tileable fractal noise texture in [0, 1] (FFT-filtered white noise), 256 x 256
function makeNoise(seed, beta, stretch = 1.0) {
  const n = 256, N = n * n;
  const rand = mulberry32(seed * 2654435761);
  const re = new Float64Array(N), im = new Float64Array(N);
  for (let i = 0; i < N; i++) re[i] = gaussian(rand);
  fft2(re, im, n, false);
  for (let y = 0; y < n; y++) {
    const fy = ((y < n / 2 ? y : y - n) / n) * stretch;
    for (let x = 0; x < n; x++) {
      const i = y * n + x;
      if (i === 0) { re[0] = 0; im[0] = 0; continue; }
      const fx = (x < n / 2 ? x : x - n) / n;
      const g = Math.pow(Math.sqrt(fx * fx + fy * fy), -beta / 2);
      re[i] *= g; im[i] *= g;
    }
  }
  fft2(re, im, n, true);
  let mean = 0;
  for (let i = 0; i < N; i++) mean += re[i];
  mean /= N;
  let v = 0;
  for (let i = 0; i < N; i++) v += (re[i] - mean) ** 2;
  const sd = Math.sqrt(v / N) || 1;
  const out = new Float32Array(N);
  for (let i = 0; i < N; i++) out[i] = clamp(0.5 + 0.18 * (re[i] - mean) / sd, 0, 1);
  return out;
}
function bil(tex, x, y) {                   // bilinear, wrapping lookup in a 256 x 256 texture
  const xf = Math.floor(x), yf = Math.floor(y);
  const fx = x - xf, fy = y - yf;
  const x0 = xf & 255, y0 = yf & 255, x1 = (x0 + 1) & 255, y1 = (y0 + 1) & 255;
  const a = tex[(y0 << 8) | x0], b = tex[(y0 << 8) | x1], c = tex[(y1 << 8) | x0], d = tex[(y1 << 8) | x1];
  return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
}
function bilRGB(img, w, h, x, y, out) {     // bilinear RGB lookup in an image; black outside it
  if (x < -0.5 || x > w - 0.5 || y < -0.5 || y > h - 0.5) { out[0] = 0; out[1] = 0; out[2] = 0; return; }
  x = x < 0 ? 0 : (x > w - 1.001 ? w - 1.001 : x);
  y = y < 0 ? 0 : (y > h - 1.001 ? h - 1.001 : y);
  const x0 = x | 0, y0 = y | 0, fx = x - x0, fy = y - y0;
  const i00 = (y0 * w + x0) * 3, i01 = i00 + 3, i10 = i00 + w * 3, i11 = i10 + 3;
  for (let c = 0; c < 3; c++) {
    const top = img[i00 + c] + (img[i01 + c] - img[i00 + c]) * fx;
    const bot = img[i10 + c] + (img[i11 + c] - img[i10 + c]) * fx;
    out[c] = top + (bot - top) * fy;
  }
}
function bil1(img, w, h, x, y) {            // bilinear lookup in a one-channel image (clamped)
  x = x < 0 ? 0 : (x > w - 1.001 ? w - 1.001 : x);
  y = y < 0 ? 0 : (y > h - 1.001 ? h - 1.001 : y);
  const x0 = x | 0, y0 = y | 0, fx = x - x0, fy = y - y0;
  const i = y0 * w + x0;
  const top = img[i] + (img[i + 1] - img[i]) * fx;
  const bot = img[i + w] + (img[i + w + 1] - img[i + w]) * fx;
  return top + (bot - top) * fy;
}
const TILT_C = Math.cos(PHOTO_EYE_TILT * Math.PI / 180), TILT_S = Math.sin(PHOTO_EYE_TILT * Math.PI / 180);
const S_EYE = PHOTO_IRIS_R / IRIS_R;        // photo pixels per eye-space unit
// eyelid lines of an open eye with shape L at u -> [vu, vl, s]  (s runs -1..1 corner to corner)
function lidCurves(u, L, out) {
  const s = (u - L.cx) / L.w, f = 1 - s * s;
  const sf = Math.sign(f), af = Math.abs(f), fpos = f > 0 ? (f < 1 ? f : 1) : 0;
  const base = L.cy + L.slope * (u - L.cx);
  out[0] = base + L.up * sf * Math.pow(af, L.upk) + L.upskew * s * fpos;
  out[1] = base - L.lo * sf * Math.pow(af, L.lok) + L.loskew * s * fpos;
  out[2] = s;
}
function sdHeart(px, py) {                  // signed distance to a heart, tip at (0, 0), top at y ~ 1.1
  px = Math.abs(px);
  if (px + py > 1.0) return Math.sqrt((px - 0.25) ** 2 + (py - 0.75) ** 2) - 0.35355339;
  const m = 0.5 * Math.max(px + py, 0.0);
  const d = Math.sqrt(Math.min(px * px + (py - 1.0) ** 2, (px - m) ** 2 + (py - m) ** 2));
  return d * Math.sign(px - py);
}
function splitMessage(msg) {                // your own line breaks (new line or |), else balanced lines
  msg = msg.replace(/\|/g, "\n");
  if (msg.includes("\n")) {
    const parts = msg.split("\n").map(p => p.trim()).filter(Boolean).slice(0, 2);
    return parts.length ? parts : [msg.trim()];
  }
  const words = msg.split(/\s+/).filter(Boolean);
  if (msg.length <= 12 || words.length < 2) return [msg];
  let cut = 1, best = Infinity;
  for (let i = 1; i < words.length; i++) {
    const d = Math.abs(words.slice(0, i).join(" ").length - words.slice(i).join(" ").length);
    if (d < best) { best = d; cut = i; }
  }
  return [words.slice(0, cut).join(" "), words.slice(cut).join(" ")];
}

// ----------------------------------------------------------------------------- glyphs
class Glyphs {
  constructor(fontPx, chars) {
    this.chars = Array.from(new Set(Array.from(chars)));
    const font = "bold " + fontPx + "px " + MONO;
    const probe = makeCanvas(8, 8).getContext("2d");
    probe.font = font;
    let w = 0;
    for (const c of RAMP) if (c !== " ") w = Math.max(w, probe.measureText(c).width);
    this.cw = Math.max(1, Math.ceil(w));
    this.ch = Math.max(1, fontPx);
    const n = this.chars.length, cw = this.cw, ch = this.ch;
    const atlas = makeCanvas(cw * n, ch);
    const g = atlas.getContext("2d", { willReadFrequently: true });
    g.fillStyle = "#000"; g.fillRect(0, 0, atlas.width, atlas.height);
    g.font = font; g.fillStyle = "#fff"; g.textAlign = "center"; g.textBaseline = "middle";
    for (let k = 0; k < n; k++) {
      if (this.chars[k] === " ") continue;
      g.save();
      g.beginPath(); g.rect(k * cw, 0, cw, ch); g.clip();
      g.fillText(this.chars[k], k * cw + cw / 2, ch / 2 + 0.5);
      g.restore();
    }
    const data = g.getImageData(0, 0, atlas.width, atlas.height).data;
    this.masks = new Uint8Array(n * cw * ch);
    for (let k = 0; k < n; k++)
      for (let y = 0; y < ch; y++)
        for (let x = 0; x < cw; x++)
          this.masks[(k * ch + y) * cw + x] = data[(y * atlas.width + k * cw + x) * 4];
    this.index = new Map(this.chars.map((c, k) => [c, k]));
  }
}

// ----------------------------------------------------------------------------- the photo
async function decodeImage(src) {
  const img = new Image();
  img.src = src;
  await img.decode();
  const c = makeCanvas(img.naturalWidth, img.naturalHeight);
  const g = c.getContext("2d", { willReadFrequently: true });
  g.drawImage(img, 0, 0);
  const d = g.getImageData(0, 0, c.width, c.height).data;
  const rgb = new Float32Array(c.width * c.height * 3);
  for (let i = 0, j = 0; i < d.length; i += 4, j += 3) {
    rgb[j] = d[i] / 255; rgb[j + 1] = d[i + 1] / 255; rgb[j + 2] = d[i + 2] / 255;
  }
  return { w: c.width, h: c.height, rgb };
}

class Photo {
  constructor(full, face) {
    this.fw = full.w; this.fh = full.h;
    this.aw = face.w; this.ah = face.h;
    this.k = full.h / PHOTO_SIZE[1];
    this.backdrop = this.backdropMask(full.w, full.h);
    const k = this.k;
    this.full = this.tone(full, (x) => (x + 0.5) / k - 0.5, (y) => (y + 0.5) / k - 0.5);
    this.face = this.tone(face, (x) => x + PHOTO_FACE_BOX[0], (y) => y + PHOTO_FACE_BOX[1]);
    this.tmp = new Float64Array(3);
    this.skin = null;
    this.ball = null;
  }
  backdropMask(w, h) {                      // soft mask (1 = wall/sofa) at the small photo's resolution
    const c = makeCanvas(w, h), g = c.getContext("2d", { willReadFrequently: true });
    g.fillStyle = "#000"; g.fillRect(0, 0, w, h);
    g.fillStyle = "#fff";
    for (const poly of PHOTO_BACKDROP) {
      g.beginPath();
      poly.forEach(([x, y], i) => (i ? g.lineTo(x * this.k, y * this.k) : g.moveTo(x * this.k, y * this.k)));
      g.closePath(); g.fill();
    }
    const sw = Math.max(1, (w / 10) | 0), sh = Math.max(1, (h / 10) | 0);
    const small = makeCanvas(sw, sh), sg = small.getContext("2d");
    for (let i = 0; i < 2; i++) {           // cheap blur: shrink, then grow back
      sg.imageSmoothingEnabled = true; sg.imageSmoothingQuality = "high";
      sg.drawImage(c, 0, 0, sw, sh);
      g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high";
      g.drawImage(small, 0, 0, w, h);
    }
    const d = g.getImageData(0, 0, w, h).data, out = new Float32Array(w * h);
    for (let i = 0; i < w * h; i++) out[i] = d[i * 4] / 255;
    return out;
  }
  tone(img, mapX, mapY) {                   // lift the dark photo, dim the background, light her face
    const { w, h, rgb } = img, out = new Float32Array(w * h * 3);
    const [gx, gy] = PHOTO_GLOW;
    for (let y = 0; y < h; y++) {
      const oy = mapY(y);
      for (let x = 0; x < w; x++) {
        const ox = mapX(x);
        const d2 = ((ox - gx) ** 2 + ((oy - gy) * 0.75) ** 2) / (620.0 * 620.0);
        let light = 0.50 + 0.50 * Math.exp(-d2);
        const bd = bil1(this.backdrop, this.fw, this.fh, (ox + 0.5) * this.k - 0.5, (oy + 0.5) * this.k - 0.5);
        light *= 1.0 - (1.0 - PHOTO_BACKDROP_DIM) * bd;
        const i = (y * w + x) * 3;
        for (let c = 0; c < 3; c++) out[i + c] = clamp(Math.pow(rgb[i + c] / 0.52, 1.15), 0, 1) * light;
      }
    }
    return out;
  }
  sample(px, py, wFace, out) {              // colour at photo pixel coordinates
    bilRGB(this.full, this.fw, this.fh, (px + 0.5) * this.k - 0.5, (py + 0.5) * this.k - 0.5, out);
    if (wFace > 0) {
      const lx = px - PHOTO_FACE_BOX[0], ly = py - PHOTO_FACE_BOX[1];
      const near = ss(0, 10, lx) * ss(0, 10, this.aw - 1 - lx) * ss(0, 10, ly) * ss(0, 10, this.ah - 1 - ly);
      if (near > 0) {
        const t = this.tmp;
        bilRGB(this.face, this.aw, this.ah, lx, ly, t);
        const wv = near * wFace;
        out[0] += (t[0] - out[0]) * wv; out[1] += (t[1] - out[1]) * wv; out[2] += (t[2] - out[2]) * wv;
      }
    }
  }
  sampleEye(u, v, wFace, out) {             // eye space -> her photo
    const dv = v + 0.06;
    this.sample(PHOTO_IRIS[0] + S_EYE * (u * TILT_C + dv * TILT_S),
                PHOTO_IRIS[1] + S_EYE * (u * TILT_S - dv * TILT_C), wFace, out);
  }
  eyeSkin() {                               // her skin, lids and lashes resampled into eye space
    if (this.skin) return this.skin;
    const [u0, v0, step] = SKIN_GRID;
    const nu = Math.round(-2 * u0 / step) + 1, nv = Math.round(-2 * v0 / step) + 1;
    const data = new Float32Array(nu * nv * 3);
    const lc = new Float64Array(3), a = new Float64Array(3), b = new Float64Array(3);
    for (let iy = 0; iy < nv; iy++) {
      const V = v0 + step * iy;
      for (let ix = 0; ix < nu; ix++) {
        const U = u0 + step * ix;
        lidCurves(U, HER_EYE, lc);
        const vu = lc[0], vl = lc[1], s = lc[2];
        const o = (iy * nu + ix) * 3;
        if (V < vu + 0.02 && V > vl - 0.02 && Math.abs(s) < 1.0) {   // the eye opening: fill from around it
          this.sampleEye(U, vu + 0.06, 1, a);
          this.sampleEye(U, vl - 0.06, 1, b);
          const f = clamp((V - vl) / Math.max(vu - vl, 1e-3), 0, 1);
          for (let c = 0; c < 3; c++) data[o + c] = b[c] + (a[c] - b[c]) * f;
        } else {
          this.sampleEye(U, V, 1, a);
          data[o] = a[0]; data[o + 1] = a[1]; data[o + 2] = a[2];
        }
      }
    }
    this.skin = { data, w: nu, h: nv };
    return this.skin;
  }
  eyeBall() {                               // her real eyeball (iris and whites) in eye space
    if (this.ball) return this.ball;
    const [u0, u1, v0, v1, step] = BALL_GRID;
    const nu = Math.round((u1 - u0) / step) + 1, nv = Math.round((v1 - v0) / step) + 1;
    const H = HER_EYE, lc = new Float64Array(3), a = new Float64Array(3);
    // her iris colour without the catch-light: the visible ring of iris away from it
    const ch = [[], [], []];
    for (const r of [0.24, 0.28, 0.32]) for (let i = 0; i < 96; i++) {
      const ang = 2 * Math.PI * i / 96, ru = r * Math.cos(ang), rv = -0.06 + r * Math.sin(ang);
      lidCurves(ru, H, lc);
      if (rv < lc[0] - 0.05 && rv > lc[1] + 0.04) {
        this.sampleEye(ru, rv, 1, a);
        ch[0].push(a[0]); ch[1].push(a[1]); ch[2].push(a[2]);
      }
    }
    const median = (arr) => {
      arr.sort((x, y) => x - y);
      const n = arr.length;
      return n ? (n % 2 ? arr[(n - 1) / 2] : 0.5 * (arr[n / 2 - 1] + arr[n / 2])) : 0;
    };
    const iris = ch.map(median);
    const [gu, gv, ax, ay] = GLINT;
    const data = new Float32Array(nu * nv * 3);
    for (let iy = 0; iy < nv; iy++) {
      const V = v0 + step * iy;
      for (let ix = 0; ix < nu; ix++) {
        const U = u0 + step * ix;
        const uc = clamp(U, H.cx - 0.9 * H.w, H.cx + 0.9 * H.w);   // hidden parts: nearest visible eyeball
        lidCurves(uc, H, lc);
        const mid = 0.5 * (lc[0] + lc[1]);
        const vc = clamp(V, Math.min(lc[1] + 0.04, mid), Math.max(lc[0] - 0.05, mid));
        this.sampleEye(uc, vc, 1, a);
        const w = ss(2.6, 1.0, Math.hypot((uc - gu) / ax, (vc - (gv - 0.06)) / ay));   // paint out her glint
        const o = (iy * nu + ix) * 3;
        for (let c = 0; c < 3; c++) data[o + c] = a[c] + (iris[c] - a[c]) * w;
      }
    }
    this.ball = { data, w: nu, h: nv };
    return this.ball;
  }
}

// ----------------------------------------------------------------------------- stars
class Stars {
  constructor(n, A, R, C, glyphs) {
    const rand = mulberry32(11);
    this.n = n; this.A = A; this.R = R; this.C = C;
    this.z0 = new Float64Array(n); this.b0 = new Float64Array(n);
    this.freq = new Float64Array(n); this.phase = new Float64Array(n); this.tint = new Uint8Array(n);
    for (let i = 0; i < n; i++) {
      this.z0[i] = rand();
      this.b0[i] = 0.25 + 0.75 * Math.pow(rand(), 1.4);
      this.freq[i] = 0.3 + rand();
      this.phase[i] = rand();
      this.tint[i] = Math.min(2, (rand() * 3) | 0);
    }
    const g = glyphs.index;
    this.cDot = g.get("."); this.cMid = g.has("·") ? g.get("·") : g.get(".");
    this.cPlus = g.get("+"); this.cCore = g.has("•") ? g.get("•") : g.get("*");
    this.cH = g.get("-"); this.cV = g.get("|");
    this.order = [];
  }
  static travel(t) { return 0.03 * t + 0.55 * ss(T_ZOOM + 3.2, T_ZOOM + 8.2, t); }
  draw(t, scene, squeeze) {
    const { n, A, R, C } = this, L = 0.8, tr = Stars.travel(t);
    const list = this.order; list.length = 0;
    const bs = this.bs || (this.bs = new Float64Array(n));
    const rs = this.rs || (this.rs = new Int32Array(n));
    const cs = this.cs || (this.cs = new Int32Array(n));
    for (let i = 0; i < n; i++) {
      const q = (1 - this.z0[i]) * L + tr;
      const k = Math.floor(q / L);
      const z = 1 - (q - k * L);
      let s1 = Math.abs(Math.sin(i * 12.9898 + k * 78.233) * 43758.5453); s1 -= Math.floor(s1);
      let s2 = Math.abs(Math.sin(i * 39.3468 + k * 11.135) * 24634.6345); s2 -= Math.floor(s2);
      const X = (2 * s1 - 1) * A / z / squeeze, Y = (2 * s2 - 1) / z / squeeze;
      let b = this.b0[i] * (0.62 + 0.38 * (1 - z) / 0.8) * clamp((1 - z) / 0.1, 0, 1);
      b *= 0.70 + 0.30 * Math.sin(2 * Math.PI * (this.freq[i] * t + this.phase[i]));
      const cc = Math.floor((X / A + 1) * 0.5 * C), rr = Math.floor((1 - Y) * 0.5 * R);
      if (b > 0.05 && cc > -4 && cc < C + 4 && rr > -4 && rr < R + 4) {
        bs[i] = b; rs[i] = rr; cs[i] = cc; list.push(i);
      }
    }
    list.sort((p, q) => bs[p] - bs[q]);
    const idx = scene.idx, gcol = scene.gcol, lum = scene.lum, mask = scene.cm;
    const stamp = (r, c, glyph, bright, tint) => {
      if (r < 0 || r >= R || c < 0 || c >= C) return;
      const i = r * C + c;
      if (mask[i] > 0.5 && lum[i] < Math.min(0.12, 0.3 * bright)) {
        idx[i] = glyph;
        const f = Math.min(bright, 1) * mask[i];
        gcol[i * 3] = tint[0] * f; gcol[i * 3 + 1] = tint[1] * f; gcol[i * 3 + 2] = tint[2] * f;
        lum[i] = bright;
      }
    };
    for (const i of list) {
      const bb = bs[i], r = rs[i], c = cs[i], tint = TINTS[this.tint[i]];
      if (bb < 0.20) stamp(r, c, this.cDot, bb * 2.2, tint);
      else if (bb < 0.32) stamp(r, c, this.cMid, bb * 1.9, tint);
      else if (bb < 0.42) stamp(r, c, this.cPlus, bb * 1.7, tint);
      else {
        const nh = 1 + ((bb - 0.42) * 7.0 | 0), nv = 1 + ((bb - 0.42) * 5.0 | 0);
        for (let s = 1; s <= nh; s++) {
          const f = bb * 1.3 * Math.pow(0.72, s);
          stamp(r, c - s, this.cH, f, tint); stamp(r, c + s, this.cH, f, tint);
        }
        for (let s = 1; s <= nv; s++) {
          const f = bb * 1.3 * Math.pow(0.70, s);
          stamp(r - s, c, this.cV, f, tint); stamp(r + s, c, this.cV, f, tint);
        }
        stamp(r, c, this.cCore, bb * 1.6, tint);
      }
    }
  }
}

// ----------------------------------------------------------------------------- scene
let NFINE = null, NMID = null, NFIB = null;

class Scene {
  constructor(fontPx, rows, cols, message, photo, supersample = SUPERSAMPLE, gain = 1.0, full = true) {
    this.glyphs = new Glyphs(fontPx, RAMP + "-|+*.·•" + SCRAMBLE);
    this.R = rows; this.C = cols;
    this.cw = this.glyphs.cw; this.ch = this.glyphs.ch;
    this.wpx = cols * this.cw; this.hpx = rows * this.ch;
    this.A = this.wpx / this.hpx;
    this.photo = photo;
    this.skin = photo ? photo.eyeSkin() : null;
    this.ball = photo ? photo.eyeBall() : null;
    this.gain = gain;
    this.sy = supersample[0]; this.sx = supersample[1];
    const N = rows * cols;
    const rand = mulberry32(5);
    this.dither = new Float32Array(N);
    for (let i = 0; i < N; i++) this.dither[i] = (rand() - 0.5) * 0.06;
    this.rampIdx = Int32Array.from(Array.from(RAMP), c => this.glyphs.index.get(c));
    this.scrIdx = Int32Array.from(Array.from(SCRAMBLE).filter(c => this.glyphs.index.has(c)), c => this.glyphs.index.get(c));
    this.stars = full ? new Stars(Math.floor(400 * this.A), this.A, rows, cols, this.glyphs) : null;
    this.makeText(full ? message : "");
    this.corner = Math.hypot(this.A, 1.0);
    // per-cell buffers
    this.cr = new Float32Array(N); this.cg = new Float32Array(N); this.cb = new Float32Array(N);
    this.cm = new Float32Array(N); this.lum = new Float32Array(N); this.idx = new Int32Array(N);
    this.gcol = new Float32Array(N * 3); this.scr = new Uint8Array(N);
    this.canvas = null; this.ctx = null;           // only needed when this scene is blended
    this.img = new ImageData(this.wpx, this.hpx);
    this.px32 = new Uint32Array(this.img.data.buffer);
    // each glyph's lit pixels, as offsets into the frame (most of a glyph is black)
    const gm = this.glyphs.masks, gsz = this.cw * this.ch, ng = this.glyphs.chars.length;
    this.gStart = new Int32Array(ng + 1);
    let count = 0;
    for (let i = 0; i < gm.length; i++) if (gm[i]) count++;
    this.gOff = new Int32Array(count); this.gVal = new Uint8Array(count);
    for (let g = 0, j = 0; g < ng; g++) {
      this.gStart[g] = j;
      for (let y = 0; y < this.ch; y++) for (let x = 0; x < this.cw; x++) {
        const m = gm[g * gsz + y * this.cw + x];
        if (m) { this.gOff[j] = y * this.wpx + x; this.gVal[j] = m; j++; }
      }
      this.gStart[g + 1] = j;
    }
    this.P = {};
    this.t3 = new Float64Array(3); this.t3b = new Float64Array(3); this.t3c = new Float64Array(3);
    this.t3d = new Float64Array(3);
    this.lc = new Float64Array(3);
  }

  // ------------------------------------------------------------------ message mask
  makeText(message) {
    const R = this.R, C = this.C, N = R * C;
    this.textCov = new Float32Array(N); this.textThr = new Float32Array(N);
    this.textRow = new Float32Array(R); this.textCpos = new Float32Array(C);
    this.textLines = 1;
    if (!message) return;
    const lines = splitMessage(message), n = lines.length;
    this.textLines = n;
    const font = "bold 200px " + SANS;
    const crops = [];
    for (const line of lines) {                     // render each line and crop it to its ink
      const m = makeCanvas(8, 8).getContext("2d"); m.font = font;
      const w = Math.ceil(m.measureText(line).width) + 40, h = 300;
      const c = makeCanvas(w, h), g = c.getContext("2d", { willReadFrequently: true });
      g.fillStyle = "#000"; g.fillRect(0, 0, w, h);
      g.font = font; g.fillStyle = "#fff"; g.textBaseline = "alphabetic"; g.fillText(line, 20, 220);
      const d = g.getImageData(0, 0, w, h).data;
      let x0 = w, x1 = -1, y0 = h, y1 = -1;
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (d[(y * w + x) * 4] > 0) {
        if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
      }
      if (x1 < x0) { x0 = 0; y0 = 0; x1 = 1; y1 = 1; }
      crops.push({ c, x: x0, y: y0, w: x1 - x0 + 1, h: y1 - y0 + 1 });
    }
    const boxW = this.wpx * 0.86, boxH = this.hpx * (n === 1 ? 0.32 : 0.27);
    const mw = Math.max(...crops.map(c => c.w)), mh = Math.max(...crops.map(c => c.h));
    const sx = Math.min(boxW / mw, boxH / mh);
    const sy = Math.min(boxH / mh, sx * 1.8);        // tall letters read better in ASCII
    const centres = n === 1 ? [-0.50] : [0.64, -0.64];
    const canvas = makeCanvas(this.wpx, this.hpx), g = canvas.getContext("2d", { willReadFrequently: true });
    g.fillStyle = "#000"; g.fillRect(0, 0, this.wpx, this.hpx);
    const order = new Float32Array(N).fill(2.0);     // reading order, for the decode sweep
    let cLo = C, cHi = 0;
    const r = Math.max(1, (this.cw / 3) | 0);         // thicken strokes so letters read clearly
    crops.forEach((cr, i) => {
      const w = Math.max(1, (cr.w * sx) | 0), h = Math.max(1, (cr.h * sy) | 0);
      const s = makeCanvas(w, h), sg = s.getContext("2d");
      sg.fillStyle = "#000"; sg.fillRect(0, 0, w, h);
      sg.imageSmoothingEnabled = true; sg.imageSmoothingQuality = "high";
      sg.drawImage(cr.c, cr.x, cr.y, cr.w, cr.h, 0, 0, w, h);
      const left = ((this.wpx / 2) | 0) - (w >> 1);
      const top = ((this.hpx * (1.0 - centres[i]) / 2.0) | 0) - (h >> 1);
      g.globalCompositeOperation = "lighten";
      for (let dx = -r; dx <= r; dx++) for (let dy = -1; dy <= 1; dy++) g.drawImage(s, left + dx, top + dy);
      g.globalCompositeOperation = "source-over";
      const r0 = Math.max(0, Math.floor(top / this.ch) - 1), r1 = Math.min(R, Math.floor((top + h) / this.ch) + 2);
      const c0 = Math.max(0, Math.floor(left / this.cw)), c1 = Math.min(C, Math.floor((left + w) / this.cw) + 1);
      cLo = Math.min(cLo, c0); cHi = Math.max(cHi, c1);
      for (let rr = r0; rr < r1; rr++) {
        for (let cc = 0; cc < C; cc++) order[rr * C + cc] = (i + clamp((cc - c0) / Math.max(c1 - c0, 1), 0, 1)) / n;
        this.textRow[rr] = r1 - r0 > 1 ? (rr - r0) / (r1 - r0 - 1) : 0;
      }
    });
    const d = g.getImageData(0, 0, this.wpx, this.hpx).data, cw = this.cw, ch = this.ch;
    const rand = mulberry32(9);
    for (let rr = 0; rr < R; rr++) for (let cc = 0; cc < C; cc++) {
      let sum = 0;
      for (let y = 0; y < ch; y++) {
        const o = ((rr * ch + y) * this.wpx + cc * cw) * 4;
        for (let x = 0; x < cw; x++) sum += d[o + x * 4];
      }
      const i = rr * C + cc;
      this.textCov[i] = ss(0.10, 0.55, sum / (cw * ch * 255));
      this.textThr[i] = 0.80 * order[i] + 0.20 * rand();
    }
    for (let cc = 0; cc < C; cc++) this.textCpos[cc] = clamp((cc - cLo) / Math.max(cHi - cLo, 1), 0, 1);
  }

  // ------------------------------------------------------------------ animation curves
  params(t) {
    const P = this.P, hasPhoto = !!this.photo;
    P.expo = ss(T_PHOTO_IN[0], T_PHOTO_IN[1], t);
    let o = 1.0;
    for (const tb of BLINKS) o *= 1.0 - ss(tb - 0.09, tb, t) * (1.0 - ss(tb + 0.03, tb + 0.20, t));
    P.open = o;
    let gx = 0, gy = 0;
    for (const [tm, x, y] of GAZE) { const k = ss(tm, tm + 0.14, t); gx += (x - gx) * k; gy += (y - gy) * k; }
    const calm = ss(T_REVEAL[1], T_REVEAL[1] + 0.6, t) * (1.0 - ss(T_ZOOM, T_ZOOM + 1.0, t));
    gx += 0.004 * Math.sin(t * 7.3) * calm;
    gy += 0.003 * Math.sin(t * 5.1 + 1.0) * calm;
    P.ix = gx; P.iy = gy - 0.06;
    P.pupil = 0.17 + 0.035 * ss(T_ZOOM + 0.5, T_ZOOM + 4.2, t);
    P.pupilDark = hasPhoto ? ss(T_PUPIL[0], T_PUPIL[1], t) : 1.0;

    // ONE camera for the whole film, in eye space: her photo and the living eye stay on top of each other
    const q = ss(T_PHOTO_ZOOM[0], T_PHOTO_ZOOM[1], t), e = ss(0.0, 0.85, q);
    const sFit = PHOTO_SIZE[1] / 2.0;
    let lk = 0.0;
    if (hasPhoto) {
      const creep = Math.log(CREEP) * (1.0 - ss(T_PHOTO_ZOOM[0] + 2.5, T_ZOOM + 0.6, t));
      lk = (Math.log(sFit / S_EYE) - Math.log(CREEP)) * (1.0 - q) + creep;
    }
    const zoom = Math.exp(0.176 * Math.pow(Math.max(t - T_ZOOM, 0.0), 1.3));
    P.detail = hasPhoto ? ss(1.2, 4.0, zoom) : 0.0;      // close-up iris detail
    const k = Math.exp(lk) / zoom;
    let tx = 0.0, ty = -0.06;
    if (hasPhoto) {
      const t0x = (PHOTO_IRIS[0] - PHOTO_SIZE[0] / 2.0) / sFit, t0y = -(PHOTO_IRIS[1] - PHOTO_SIZE[1] / 2.0) / sFit;
      tx = t0x * (1.0 - e); ty = t0y + (-0.06 - t0y) * e;
    }
    const rho = hasPhoto ? PHOTO_EYE_TILT * Math.PI / 180 * (1.0 - e) : 0.0;
    const cr = Math.cos(rho), sr = Math.sin(rho);
    let cu = 0.0 - k * (tx * cr - ty * sr), cv = -0.06 - k * (tx * sr + ty * cr);
    const cz = ss(T_ZOOM, T_ZOOM + 1.5, t);
    cu += (gx - cu) * cz; cv += (gy - 0.06 - cv) * cz;
    P.cu = cu; P.cv = cv; P.k = k; P.cr = cr; P.sr = sr;
    const sLo = hasPhoto ? 0.70 * this.R * this.sy / (2.0 * this.photo.k) : 1.0;
    P.wFace = ss(1.4 * sLo, sLo, k * S_EYE);
    P.front = hasPhoto ? -0.4 + 3.2 * ss(T_REVEAL[0], T_REVEAL[1], t) : 99.0;
    P.glint = 1.0 - ss(T_ZOOM + 4.5, T_ZOOM + 5.8, t);
    P.space = ss(T_ZOOM + 0.6, T_ZOOM + 1.8, t);
    P.eyeGone = (P.pupil - 0.03 * IRIS_R) / k > this.corner + 0.03;
    P.squeeze = Math.min(Math.max(Z_FULL / zoom, 1.0), 2.2);   // space seen through the pupil is compressed

    // heart, then the message
    const bt = beat(t);
    let s = 0.16 * ss(T_ZOOM + 3.5, T_ZOOM + 4.7, t) + 0.20 * ss(T_ZOOM + 5.2, T_ZOOM + 7.2, t)
          + 0.44 * ss(T_ZOOM + 7.0, T_ZOOM + 9.0, t);
    const mv = ss(T_TEXT - 0.8, T_TEXT + 0.2, t);
    if (this.textLines === 1) { s -= 0.28 * mv; P.hx = 0.0; P.hy = 0.45 * mv; }
    else { s -= 0.30 * mv; P.hx = 0.0; P.hy = 0.0; }
    P.heartS = s * (1.0 + 0.075 * bt) / P.squeeze;
    P.heartB = (0.95 + 0.20 * bt) * ss(T_ZOOM + 3.5, T_ZOOM + 4.5, t);
    P.heartHi = 0.75 + 0.25 * bt;
    return P;
  }

  // ------------------------------------------------------------------ the eye (one sample)
  eye(u, v, P, out) {
    const o = P.open, L = HER_EYE, lc = this.lc;
    lidCurves(u, L, lc);
    const vuOpen = lc[0], vl = lc[1], s = lc[2];
    const vu = vl + (vuOpen - vl) * o;
    const as = Math.abs(s);
    const mid = 0.5 * (vu + vl);
    const wm = 0.015 + 0.30 * Math.max(as - 0.95, 0.0);
    const up = ss(-wm, wm, v - mid), lo = 1.0 - up;
    const du = v - vu, dl = vl - v, dd = up * du + lo * dl;
    if (this.skin) this.herSkin(u, v, vu, vl, s, up, o, out);
    else this.drawnSkin(u, v, vu, vl, vuOpen, s, up, lo, dl, dd, o, out);

    const inside = ss(-0.012, 0.02, vu - v) * ss(-0.012, 0.02, v - vl);
    if (this.ball) {                              // her own eyeball from the photo
      if (inside <= 0) return 0.0;
      const b = this.t3d, pm = this.herBall(u, v, P, b);
      out[0] += (b[0] - out[0]) * inside; out[1] += (b[1] - out[1]) * inside; out[2] += (b[2] - out[2]) * inside;
      return pm * inside;
    }
    let pupilM = 0.0;                             // no photo: a drawn eyeball
    if (inside > 0) {
      // sclera
      const lidsh = (0.25 + 0.75 * ss(0.0, 0.22, vu - v)) * (0.70 + 0.30 * ss(0.0, 0.07, v - vl));
      const ix = P.ix, iy = P.iy;
      const ru = (u - ix) / 1.55, rv = (v - iy) / 0.95;
      const ball = 1.0 - 0.45 * clamp(ru * ru + rv * rv, 0, 1);
      const veins = clamp((bil(NMID, u * 16.0 + 30.0, v * 16.0 + 70.0) - 0.56) * 5.0, 0, 1);
      const red = 0.35 * veins * ss(0.30, 0.95, as) + 0.30 * ss(0.72, 1.0, as);
      let br = SCLERA[0] + (VEIN[0] - SCLERA[0]) * red;
      let bg = SCLERA[1] + (VEIN[1] - SCLERA[1]) * red;
      let bb = SCLERA[2] + (VEIN[2] - SCLERA[2]) * red;
      const cgw = 0.85 * Math.exp(-((((u - (L.cx + 0.92 * L.w)) / 0.10) ** 2) + (((v - mid) / 0.07) ** 2)));
      br += (CARUNCLE[0] - br) * cgw; bg += (CARUNCLE[1] - bg) * cgw; bb += (CARUNCLE[2] - bb) * cgw;
      const sk = ball * lidsh;
      br *= sk; bg *= sk; bb *= sk;
      // iris + pupil
      const dx = u - ix, dy = v - iy;
      const rn = Math.sqrt(dx * dx + dy * dy) / IRIS_R, rpn = P.pupil / IRIS_R;
      if (rn < 1.0) {
        const ang = Math.atan2(dy, dx) * (256.0 / (2.0 * Math.PI));
        const fib = bil(NFIB, ang, rn * 20.0 + 7.0);
        const fib2 = bil(NFINE, ang * 2.0, rn * 36.0 + 3.0);
        const t1 = ss(0.68, 0.97, rn);
        let ir = IRIS_MID[0] + (IRIS_OUT[0] - IRIS_MID[0]) * t1;
        let ig = IRIS_MID[1] + (IRIS_OUT[1] - IRIS_MID[1]) * t1;
        let ib = IRIS_MID[2] + (IRIS_OUT[2] - IRIS_MID[2]) * t1;
        const coll = 0.70 * Math.exp(-(((rn - (rpn + 0.15)) / 0.09) ** 2));
        ir += (IRIS_COLL[0] - ir) * coll; ig += (IRIS_COLL[1] - ig) * coll; ib += (IRIS_COLL[2] - ib) * coll;
        const streak = clamp(0.5 + 2.2 * (fib - 0.5), 0, 1);
        const f = (1.0 - 0.45 * ss(rpn + 0.07, rpn, rn)) * (0.30 + 1.05 * streak + 0.30 * (fib2 - 0.5))
                * (1.0 - 0.85 * ss(0.90, 1.0, rn)) * (0.25 + 0.75 * lidsh);
        ir *= f; ig *= f; ib *= f;
        const irisM = ss(1.0, 0.97, rn);
        br += (ir - br) * irisM; bg += (ig - bg) * irisM; bb += (ib - bb) * irisM;
        pupilM = ss(rpn + 0.025, rpn - 0.025, rn);
        br += (PUPIL[0] - br) * pupilM; bg += (PUPIL[1] - bg) * pupilM; bb += (PUPIL[2] - bb) * pupilM;
      }
      if (P.glint > 0.0) {
        const g1 = Math.exp(-((((dx - 0.05) / 0.06) ** 2) + (((dy - 0.15) / 0.048) ** 2)));
        const g2 = Math.exp(-((((dx + 0.15) / 0.03) ** 2) + (((dy + 0.13) / 0.022) ** 2)));
        const gl = (1.3 * g1 + 0.45 * g2) * P.glint * lidsh;
        br += gl; bg += gl; bb += gl;
      }
      out[0] += (br - out[0]) * inside; out[1] += (bg - out[1]) * inside; out[2] += (bb - out[2]) * inside;
    }
    if (!this.skin) {                             // no photo: drawn lashes and lid rims
      const corner = ss(1.06, 0.92, as);
      const water = 0.55 * Math.exp(-(((dl + 0.012) / 0.016) ** 2)) * corner;
      out[0] += (WATER[0] - out[0]) * water; out[1] += (WATER[1] - out[1]) * water; out[2] += (WATER[2] - out[2]) * water;
      const lash = Math.exp(-(((du - 0.016) / 0.042) ** 2)) * corner;
      const skx = (u + 0.8 * Math.max(du, 0.0) * Math.sign(s)) * 30.0 + 40.0;
      const strands = ss(0.48, 0.66, bil(NFINE, skx, du * 2.0 + 60.0));
      const lashes = strands * ss(0.16, 0.0, du) * ss(-0.02, 0.0, du) * corner;
      const lower = Math.exp(-(((dl - 0.012) / 0.024) ** 2)) * corner;
      const dark = clamp(0.95 * lash + 0.80 * lashes + 0.50 * lower, 0, 0.96);
      out[0] += (LASH[0] - out[0]) * dark; out[1] += (LASH[1] - out[1]) * dark; out[2] += (LASH[2] - out[2]) * dark;
    }
    return pupilM * inside;
  }

  // her own eyeball from the photo: it turns with the glances; up close her iris gets fine detail,
  // and the pupil opens for the dive. Writes the colour to out, returns how much is pupil.
  herBall(u, v, P, out) {
    const ix = P.ix, iy = P.iy, tex = this.ball, [u0, , v0, , step] = BALL_GRID;
    bilRGB(tex.data, tex.w, tex.h, clamp((u - ix - u0) / step, 0, tex.w - 1.001),
           clamp((v - (iy + 0.06) - v0) / step, 0, tex.h - 1.001), out);
    const dx = u - ix, dy = v - iy;
    const rn = Math.sqrt(dx * dx + dy * dy) / IRIS_R, rpn = P.pupil / IRIS_R, det = P.detail;
    if (det > 0 && rn < 1.0) {                    // close up: her iris, brighter and finely detailed
      const inIris = ss(1.0, 0.94, rn);
      const lum = 0.55 * Math.max(out[0], out[1], out[2]) + 0.45 * (0.299 * out[0] + 0.587 * out[1] + 0.114 * out[2]);
      const w = 0.85 * det * inIris;
      for (let c = 0; c < 3; c++) out[c] += (lum * BROWN_N[c] - out[c]) * w;
      const ang = Math.atan2(dy, dx) * (256.0 / (2.0 * Math.PI));
      const fib = bil(NFIB, ang, rn * 20.0 + 7.0), fib2 = bil(NFINE, ang * 2.0, rn * 36.0 + 3.0);
      const streak = clamp(0.5 + 2.2 * (fib - 0.5), 0, 1);
      const fibres = (0.30 + 1.05 * streak + 0.30 * (fib2 - 0.5)) / 0.825;
      const coll = Math.exp(-(((rn - (rpn + 0.15)) / 0.09) ** 2));
      const lift = (1.0 + (IRIS_EXPOSURE - 1.0) * det) * (1.0 + det * (fibres * (1.0 + 0.35 * coll) - 1.0));
      const f = 1.0 + inIris * (lift - 1.0);
      out[0] *= f; out[1] *= f; out[2] *= f;
    }
    const pupilM = ss(rpn + 0.025, rpn - 0.025, rn) * P.pupilDark;
    if (pupilM > 0) for (let c = 0; c < 3; c++) out[c] += (PUPIL[c] - out[c]) * pupilM;
    if (P.glint > 0.0) {                          // her catch-light, sharpening as we get close
      const sharp = 1.0 - 0.45 * det;
      const g = Math.exp(-((((dx - GLINT[0]) / (GLINT[2] * sharp)) ** 2) + (((dy - GLINT[1]) / (GLINT[3] * sharp)) ** 2)))
              * P.glint * (1.0 + 0.5 * det);
      for (let c = 0; c < 3; c++) out[c] += GLINT[4][c] * g;
    }
    return pupilM;
  }

  // her own skin, lids and lashes; the upper lid follows the living eye's lid
  herSkin(u, v, vu, vl, s, up, o, out) {
    const H = HER_EYE, sh = (u - H.cx) / H.w, fh = 1 - sh * sh;
    const vuH = H.cy + H.slope * (u - H.cx) + H.up * Math.sign(fh) * Math.pow(Math.abs(fh), H.upk)
              + H.upskew * sh * (fh > 0 ? (fh < 1 ? fh : 1) : 0);
    const cw = ss(1.0, 0.85, Math.abs(s));
    const vt = vuH + LID_TOP;
    const z = v - vu;
    const lc = Math.max(vt - vu, LID_BAND + 1e-3);
    const zp = z < LID_BAND ? z + LID_OFF
             : LID_BAND + LID_OFF + (z - LID_BAND) * (LID_TOP - LID_BAND - LID_OFF) / (lc - LID_BAND);
    const vUp = z < lc ? vuH + zp : v;
    const vLo = v - LID_OFF * (1.0 - ss(0.0, 0.15, vl - v));
    const vs = v + (vLo + (vUp - vLo) * up - v) * cw;
    const [u0, v0, step] = SKIN_GRID, tex = this.skin;
    const x = clamp((u - u0) / step, 0, tex.w - 1.001), y = clamp((vs - v0) / step, 0, tex.h - 1.001);
    bilRGB(tex.data, tex.w, tex.h, x, y, out);
    if (o < 1.0) {                                 // a closing lid unfolds into smooth, lit skin
      const a = clamp((z - LID_BAND) / (lc - LID_BAND), 0, 1);
      const dome = clamp(Math.sin(Math.PI * a), 0, 1) * cw * up;
      const stretch = (lc - LID_BAND) / (LID_TOP - LID_BAND - LID_OFF);
      const t = this.t3c;
      bilRGB(tex.data, tex.w, tex.h, x, clamp((vt - v0) / step, 0, tex.h - 1.001), t);
      const w = clamp(stretch - 1.0, 0, 1) * 0.8 * dome, lit = 1.0 + (1.0 - o) * 0.20 * dome;
      for (let c = 0; c < 3; c++) out[c] = (out[c] + (t[c] * 1.12 - out[c]) * w) * lit;
    }
  }

  // fallback skin when the photo can't be used
  drawnSkin(u, v, vu, vl, vuOpen, s, up, lo, dl, dd, o, out) {
    const tx = bil(NFINE, u * 38.0 + 101.0, v * 38.0 + 57.0), tx2 = bil(NMID, u * 9.0 + 13.0, v * 9.0 + 77.0);
    const c2 = ss(1.12, 0.95, Math.abs(s));
    const vCr = vuOpen + 0.20;
    const lt = clamp((v - vu) / Math.max(vCr - vu, 1e-3), 0, 1);
    const dome = clamp(Math.sin(Math.PI * lt), 0, 1);
    const lidB = 0.36 + 0.12 * dome + (1.0 - o) * (0.10 + 0.40 * Math.sqrt(dome));
    const browB = 0.34 + 0.40 * ss(vCr, vCr + 0.30, v);
    let upperB = (v < vCr ? lidB : browB) - 0.14 * Math.exp(-(((v - vCr) / 0.035) ** 2));
    upperB = (0.72 + (upperB - 0.72) * c2) * 0.86;
    let lowerB = 0.62 + 0.10 * Math.exp(-(((dl - 0.08) / 0.05) ** 2)) - 0.28 * Math.exp(-(((dl - 0.20) / 0.045) ** 2))
               + 0.36 * ss(0.22, 0.55, dl);
    lowerB = 0.80 + (lowerB - 0.80) * c2;
    const sh = clamp((up * upperB + lo * lowerB) * (0.70 + 0.30 * ss(0.0, 0.06, dd)), 0.05, 1.3);
    const lidzone = 0.55 * up * ss(0.03, -0.03, v - vCr) * c2;
    const tex = 0.82 + 0.30 * tx + 0.12 * (tx2 - 0.5);
    for (let c = 0; c < 3; c++) {
      const sk = SKIN[c] * tex;
      out[c] = (sk + (LID[c] - sk) * lidzone) * sh;
    }
  }

  // ------------------------------------------------------------------ space + heart (one sample)
  space(X, Y, P, out) {
    out[0] = 0; out[1] = 0; out[2] = 0;
    const S = P.heartS;
    if (S <= 0.004) return;
    const px = (X - P.hx) / S, py = (Y - P.hy) / S + 0.55;
    const d = sdHeart(px, py), dw = d * S;
    const inside = ss(0.012, -0.012, dw);
    const depth = clamp(-d / 0.30, 0, 1);
    const dome = Math.sqrt(1.0 - (1.0 - depth) ** 2);
    const band = Math.exp(-(((py - 0.62) / 0.14) ** 2)) * dome * dome;
    const spec = Math.exp(-((((px + 0.24) / 0.12) ** 2) + (((py - 0.82) / 0.09) ** 2)));
    const hi = clamp(0.60 * band + 0.85 * spec, 0, 1) * P.heartHi;
    const glow = Math.exp(-Math.max(dw, 0.0) / 0.035) * (1.0 - inside) * 0.25 * P.heartB;
    for (let c = 0; c < 3; c++) {
      let hc = HEART_EDGE[c] + (HEART_CORE[c] - HEART_EDGE[c]) * dome;
      hc = (hc + (HEART_HI[c] - hc) * hi) * P.heartB;
      const g = HEART_GLOW[c] * glow;
      out[c] = g + (hc - g) * inside;
    }
  }

  // ------------------------------------------------------------------ one frame
  render(t) {
    const P = this.params(t);
    const R = this.R, C = this.C, sy = this.sy, sx = this.sx, N = R * C;
    const NY = R * sy, NX = C * sx, A = this.A, inv = 1.0 / (sy * sx), gain = P.expo * this.gain;
    const cr = this.cr, cg = this.cg, cb = this.cb, cm = this.cm;
    cr.fill(0); cg.fill(0); cb.fill(0); cm.fill(0);
    const col = this.t3, tmp = this.t3b, front = P.front, photo = this.photo;
    for (let i = 0; i < NY; i++) {
      const Y = 1.0 - (i + 0.5) / NY * 2.0, row = ((i / sy) | 0) * C;
      for (let j = 0; j < NX; j++) {
        const X = ((j + 0.5) / NX * 2.0 - 1.0) * A;
        let spm = 0.0;
        if (P.eyeGone) {
          this.space(X, Y, P, col); spm = 1.0;
        } else {
          const u = P.cu + P.k * (X * P.cr - Y * P.sr), v = P.cv + P.k * (X * P.sr + Y * P.cr);
          if (front > -0.4) {                      // the living eye
            const pupil = this.eye(u, v, P, col);
            if (P.space > 0.0) {
              spm = pupil * P.space;
              if (spm > 0) {
                this.space(X, Y, P, tmp);
                col[0] += (tmp[0] - col[0]) * spm; col[1] += (tmp[1] - col[1]) * spm; col[2] += (tmp[2] - col[2]) * spm;
              }
            }
          }
          if (front < 2.8) {                       // her photo, wherever the change hasn't reached
            photo.sampleEye(u, v, P.wFace, tmp);
            if (front <= -0.4) { col[0] = tmp[0]; col[1] = tmp[1]; col[2] = tmp[2]; }
            else {
              const r = Math.sqrt((u / 1.25) ** 2 + (v + 0.06) ** 2);
              const w = ss(front + 0.4, front - 0.4, r);
              col[0] = tmp[0] + (col[0] - tmp[0]) * w; col[1] = tmp[1] + (col[1] - tmp[1]) * w;
              col[2] = tmp[2] + (col[2] - tmp[2]) * w;
              spm *= w;
            }
          }
        }
        const c = row + ((j / sx) | 0);
        cr[c] += col[0]; cg[c] += col[1]; cb[c] += col[2]; cm[c] += spm;
      }
    }
    const k = inv * gain;
    for (let i = 0; i < N; i++) { cr[i] *= k; cg[i] *= k; cb[i] *= k; cm[i] *= inv; }

    // message: decode sweep, then shimmer
    const scr = this.scr; scr.fill(0);
    if (t > T_TEXT && this.textLines) {
      const pr = (t - T_TEXT) / T_DECODE * 1.25;
      const band = ((t - T_TEXT) * 0.28) % 1.6 - 0.3;
      for (let r = 0; r < R; r++) {
        const rp = this.textRow[r];
        const tr0 = TEXT_TOP[0] + (TEXT_BOT[0] - TEXT_TOP[0]) * rp;
        const tg0 = TEXT_TOP[1] + (TEXT_BOT[1] - TEXT_TOP[1]) * rp;
        const tb0 = TEXT_TOP[2] + (TEXT_BOT[2] - TEXT_TOP[2]) * rp;
        for (let c = 0; c < C; c++) {
          const i = r * C + c, cov = this.textCov[i];
          if (cov <= 0.02) continue;
          const state = clamp((pr - this.textThr[i]) / 0.15, 0, 1);
          const done = state >= 1.0;
          if (done) {
            const shine = 0.6 * Math.exp(-(((this.textCpos[c] - band) / 0.07) ** 2));
            cr[i] += (tr0 + (1 - tr0) * shine - cr[i]) * cov;
            cg[i] += (tg0 + (1 - tg0) * shine - cg[i]) * cov;
            cb[i] += (tb0 + (1 - tb0) * shine - cb[i]) * cov;
          } else if (state > 0 && cov > 0.15) scr[i] = 1;
        }
      }
    }

    const idx = this.idx, gcol = this.gcol, lum = this.lum, dither = this.dither, ramp = this.rampIdx;
    const RL = RAMP.length;
    let maxMask = 0;
    for (let i = 0; i < N; i++) {
      const r = clamp(cr[i], 0, 1), g = clamp(cg[i], 0, 1), b = clamp(cb[i], 0, 1);
      const l = 0.55 * Math.max(r, g, b) + 0.45 * (0.299 * r + 0.587 * g + 0.114 * b);
      const kq = Math.pow(l, 0.6) + dither[i] * clamp(l * 8.0, 0, 1);
      idx[i] = ramp[clamp(Math.floor(kq * (RL - 1) + 0.5), 0, RL - 1)];
      const den = 1.12 / Math.pow(Math.max(l, 0.08), 0.40);
      gcol[i * 3] = clamp(r * den, 0, 1); gcol[i * 3 + 1] = clamp(g * den, 0, 1); gcol[i * 3 + 2] = clamp(b * den, 0, 1);
      lum[i] = l;
      if (scr[i]) {
        idx[i] = this.scrIdx[(Math.random() * this.scrIdx.length) | 0];
        gcol[i * 3] = 1.0; gcol[i * 3 + 1] = 0.85; gcol[i * 3 + 2] = 0.95;
        lum[i] = 1.0;
      }
      if (cm[i] > maxMask) maxMask = cm[i];
    }
    if (maxMask > 0.5 && this.stars) this.stars.draw(t, this, P.squeeze);
    this.compose();
    return this.img;
  }

  compose() {                                       // glyph masks x per-cell colours -> pixels
    const { R, C, cw, ch, wpx } = this, gStart = this.gStart, gOff = this.gOff, gVal = this.gVal;
    const px = this.px32, idx = this.idx, gcol = this.gcol;
    px.fill(0xFF000000);
    for (let r = 0; r < R; r++) {
      const rowBase = r * ch * wpx;
      for (let c = 0; c < C; c++) {
        const i = r * C + c, g = idx[i], s = gStart[g], e = gStart[g + 1];
        if (s === e) continue;
        const cr = (gcol[i * 3] * 255 + 0.5) | 0, cg = (gcol[i * 3 + 1] * 255 + 0.5) | 0, cb = (gcol[i * 3 + 2] * 255 + 0.5) | 0;
        if ((cr | cg | cb) === 0) continue;
        const base = rowBase + c * cw;
        for (let j = s; j < e; j++) {
          const m = gVal[j];
          px[base + gOff[j]] = 0xFF000000 | (((m * cb) >> 8) << 16) | (((m * cg) >> 8) << 8) | ((m * cr) >> 8);
        }
      }
    }
  }

  blendable() {                                     // an offscreen copy, for drawing with transparency
    if (!this.canvas) { this.canvas = makeCanvas(this.wpx, this.hpx); this.ctx = this.canvas.getContext("2d"); }
    this.ctx.putImageData(this.img, 0, 0);
    return this.canvas;
  }
}

// ----------------------------------------------------------------------------- page
const stage = document.getElementById("screen");
const sctx = stage.getContext("2d");
const params = new URLSearchParams(location.search);
const message = (params.get("msg") || MESSAGE).trim() || MESSAGE;
const freezeAt = params.has("at") ? parseFloat(params.get("at")) : null;
let photo = null, scene = null, intro = null, t0 = 0, hiddenAt = null, layoutKey = "", lastDraw = -1;

function cellWidth(px) {
  const probe = makeCanvas(8, 8).getContext("2d");
  probe.font = "bold " + px + "px " + MONO;
  let w = 0;
  for (const c of RAMP) if (c !== " ") w = Math.max(w, probe.measureText(c).width);
  return Math.max(1, Math.ceil(w));
}

function layout() {
  const vw = Math.max(1, window.innerWidth), vh = Math.max(1, window.innerHeight);
  const dpr = window.devicePixelRatio || 1;
  const W = vw * dpr, H = vh * dpr;                     // device pixels available
  const aspect = clamp(W / H, ASPECT, MAX_ASPECT);
  const ph = Math.min(H, W / aspect), pw = ph * aspect;   // the picture's box, in device pixels
  const scale = Math.max(1, Math.ceil(ph / MAX_HEIGHT));  // big screens: draw smaller, show bigger
  const ch = Math.max(7, Math.floor(ph / scale / ROWS));
  const cols = Math.max(40, Math.floor(pw / scale / cellWidth(ch)));
  return { ch, cols, scale, dpr, W, H };
}

function build() {
  const L = layout();
  const key = L.ch + "x" + L.cols;
  if (key !== layoutKey) {
    layoutKey = key;
    scene = new Scene(L.ch, ROWS, L.cols, message, photo);
    intro = null;
    if (photo && INTRO_DETAIL > 1.0) {
      const chI = Math.max(5, Math.floor(scene.ch / INTRO_DETAIL)), cwI = cellWidth(chI);
      intro = new Scene(chI, Math.floor(scene.hpx / chI), Math.floor(scene.wpx / cwI), message, photo, [1, 1], 1.25, false);
    }
    stage.width = scene.wpx; stage.height = scene.hpx;
    lastDraw = -1;
  }
  // show it 1:1 on the screen's pixels (crisp), centred on whole pixels
  const s = L.scale;
  stage.style.imageRendering = s > 1 ? "pixelated" : "auto";
  stage.style.width = (scene.wpx * s / L.dpr) + "px";
  stage.style.height = (scene.hpx * s / L.dpr) + "px";
  stage.style.left = (Math.round((L.W - scene.wpx * s) / 2) / L.dpr) + "px";
  stage.style.top = (Math.round((L.H - scene.hpx * s) / 2) / L.dpr) + "px";
}

function draw(t) {
  if (intro && t < T_GRID[1]) {
    const a = ss(T_GRID[0], T_GRID[1], t);
    if (a > 0) sctx.putImageData(scene.render(t), 0, 0);
    else { sctx.fillStyle = "#000"; sctx.fillRect(0, 0, stage.width, stage.height); }
    intro.render(t);
    const fine = intro.blendable();
    sctx.globalAlpha = 1 - a;
    sctx.drawImage(fine, (stage.width - fine.width) >> 1, (stage.height - fine.height) >> 1);
    sctx.globalAlpha = 1;
  } else {
    sctx.putImageData(scene.render(t), 0, 0);
  }
}

function now() { return performance.now() / 1000; }
function restart() { t0 = now(); lastDraw = -1; }
function frame() {
  requestAnimationFrame(frame);
  if (hiddenAt !== null) return;
  const t = now() - t0;
  if (lastDraw >= 0 && t - lastDraw < 1 / FPS - 0.004) return;   // steady FPS frames per second
  lastDraw = t;
  draw(t);
}
function isFullscreen() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
async function toggleFullscreen() {
  try {
    if (isFullscreen()) {
      await (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      return false;
    }
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) { await req.call(el); return true; }
  } catch (e) { /* not allowed here: just keep playing */ }
  return false;
}

// controls: the first click goes full screen and starts over; after that clicks do nothing,
// so a stray click can't interrupt the moment (R, Space or a double-click replays)
let idleTimer = null, hints = true, started = false;
function wake() {
  document.body.classList.remove("idle");
  if (hints) document.body.classList.add("awake");
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { document.body.classList.remove("awake"); document.body.classList.add("idle"); }, 2200);
}
function quiet() { hints = false; document.body.classList.remove("awake"); }
window.addEventListener("mousemove", wake);
window.addEventListener("click", async () => {
  if (started) return;
  started = true; quiet();
  if (!isFullscreen()) await toggleFullscreen();
  restart();
});
window.addEventListener("dblclick", () => restart());
window.addEventListener("keydown", async (ev) => {
  const k = ev.key.toLowerCase();
  if (k === "r" || k === " ") { ev.preventDefault(); quiet(); restart(); }
  else if (k === "f") { quiet(); started = true; if (await toggleFullscreen()) restart(); }
});
document.addEventListener("visibilitychange", () => {   // pause while the tab is hidden
  if (document.hidden) hiddenAt = now();
  else if (hiddenAt !== null) { t0 += now() - hiddenAt; hiddenAt = null; }
});
let resizeTimer = null;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(build, 200); });

async function keepAwake() {
  try { if (navigator.wakeLock) await navigator.wakeLock.request("screen"); } catch (e) { /* fine */ }
}

async function start() {
  NFINE = makeNoise(1, 1.2);
  NMID = makeNoise(2, 2.4);
  NFIB = makeNoise(3, 1.6, 5.0);
  try {
    const [full, face] = await Promise.all([decodeImage(PHOTO_FULL_JPG), decodeImage(PHOTO_FACE_JPG)]);
    photo = new Photo(full, face);
  } catch (e) {
    console.warn("Could not load the photo; starting with the eye.", e);
    photo = null;
  }
  build();
  window.__renderAt = (t) => { draw(t); return true; };   // for testing a single moment
  window.__ready = true;
  if (freezeAt !== null && isFinite(freezeAt)) { draw(freezeAt); return; }
  keepAwake();
  wake();                                       // show the hint for a moment
  restart();
  requestAnimationFrame(frame);
}
